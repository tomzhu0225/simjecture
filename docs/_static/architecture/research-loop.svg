<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 585" role="img" aria-labelledby="title desc">
<title id="title">The Simjecture research loop</title>
<desc id="desc">A human frames the hypothesis and resources. An autonomous worker submits frozen numerical experiments to independent review. Evidence gaps lead back to investigation. A reviewed counterexample can lead to a committed repair and fresh tests. Reviewed conclusions retain their scope; deadlines can leave the question open.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#817997" stroke-width="1.5"/></marker></defs>
<rect width="1160" height="585" rx="20" fill="#f7f7fb"/>
<g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#202332">
<rect x="60" y="24" width="1040" height="84" rx="12" fill="#eeebfc" stroke="#d7d0f5"/>
<text x="84" y="56" font-size="19" font-weight="700">HUMAN DIRECTION</text>
<text x="84" y="84" font-size="17">Question · physical assumptions · evidence requirements · resources · steering</text>
<g stroke="#817997" stroke-width="2" fill="none" marker-end="url(#arrow)">
<path d="M210 108V162"/><path d="M360 234H422"/><path d="M730 234H792"/>
<path d="M840 300V352H210V308"/><path d="M950 300V420"/>
<path d="M850 352V389H580V420"/><path d="M430 470H28V234H52"/>
</g>
<g fill="#fff" stroke="#dcd9e7"><rect x="60" y="170" width="300" height="130" rx="12"/><rect x="430" y="170" width="300" height="130" rx="12"/><rect x="800" y="170" width="300" height="130" rx="12"/></g>
<g font-size="21" font-weight="700"><text x="82" y="207">Investigate</text><text x="452" y="207">Run &amp; preserve</text><text x="822" y="207">Review independently</text></g>
<g font-size="16" fill="#565568"><text x="82" y="240">Plan, build, search for</text><text x="82" y="264">counterexamples and controls</text><text x="452" y="240">Frozen inputs, commands,</text><text x="452" y="264">outputs and execution receipts</text><text x="822" y="240">Claim, numerical validity,</text><text x="822" y="264">provenance and scope</text></g>
<rect x="402" y="334" width="259" height="28" rx="8" fill="#f7f7fb"/>
<text x="420" y="354" font-size="16" fill="#625775">Evidence gaps → more work</text>
<rect x="430" y="428" width="300" height="91" rx="12" fill="#eeebfc" stroke="#d7d0f5"/>
<text x="452" y="461" font-size="20" font-weight="700">Commit a minimal repair</text><text x="452" y="491" font-size="16" fill="#565568">New prediction → fresh tests</text>
<text x="585" y="411" font-size="15" fill="#625775">Reviewed counterexample¹</text>
<rect x="800" y="428" width="300" height="91" rx="12" fill="#eaf5f1" stroke="#c9e2d8"/>
<text x="822" y="461" font-size="20" font-weight="700">A reviewed conclusion</text><text x="822" y="491" font-size="16" fill="#565568">Evidence and limits included</text>
<text x="60" y="557" font-size="15" fill="#625775">¹ Repair policy continues after falsification. Answer policy can finish there. The deadline may leave either study incomplete.</text>
</g></svg>
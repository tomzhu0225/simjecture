name: Publish documentation

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - demos/**
      - src/conjecture_solver/web/static/brand/**
      - scripts/check_docs_links.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/configure-pages@v6
      - name: Install locked documentation environment
        run: |
          python -m pip install uv
          uv sync --frozen --group docs
      - name: Build and validate
        run: |
          uv run --group docs sphinx-build -W --keep-going -b html docs docs/_build/html
          uv run python scripts/check_docs_links.py docs/_build/html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish validated documentation
        id: deployment
        uses: actions/deploy-pages@v5

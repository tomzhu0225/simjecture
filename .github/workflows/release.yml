name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-pypi:
    name: Publish Python distribution to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/simjecture
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build frontend
        run: python -m pip install uv
      - name: Install sandbox runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          if sysctl kernel.unprivileged_userns_clone > /dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl kernel.apparmor_restrict_unprivileged_userns > /dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --die-with-parent \
            --ro-bind /usr /usr \
            --ro-bind /lib /lib \
            --ro-bind /lib64 /lib64 \
            /usr/bin/true
      - name: Install locked test environment
        run: uv sync --frozen --extra tui --extra dsh --extra workspace --group browser
      - name: Install browser test runtime
        run: uv run playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: integrations/dsh/package-lock.json
      - name: Install pinned DSH test runtime
        run: npm ci --prefix integrations/dsh
      - name: Test DSH adapter and real MCP profile
        run: SIMJECTURE_MCP_EXECUTABLE="$PWD/.venv/bin/simjecture-mcp" npm test --prefix integrations/dsh
      - name: Lint release source
        run: uv run ruff check .
      - name: Test release source
        run: uv run pytest --cov=conjecture_solver --cov-report=term-missing
      - name: Require the release tag to match the package version
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as stream:
              version = tomllib.load(stream)["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"release tag {tag!r} does not match {expected!r}")
          PY
      - name: Build source and wheel distributions
        run: uv build
      - name: Package and verify the one-command workspace installer
        run: |
          uv run python scripts/package_workspace.py --output dist
          uv run python scripts/verify_workspace_install.py --release-dir dist --work-dir /tmp/simjecture-installer-validation
      - name: Attach installable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/install.sh dist/SHA256SUMS dist/*-workspace.tar.gz --clobber
      - name: Collect Python distributions
        run: |
          mkdir pypi-dist
          cp dist/*.whl pypi-dist/
          find dist -maxdepth 1 -name '*.tar.gz' ! -name '*-workspace.tar.gz' -exec cp {} pypi-dist/ \;
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi-dist/

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "simjecture"
version = "0.3.0"
description = "Evidence-governed autonomous experimentation and falsification for computational science"
readme = "README.md"
license = "Apache-2.0"
authors = [
  { name = "Bowen Zhu" },
]
requires-python = ">=3.11"
keywords = [
  "autonomous science",
  "computational physics",
  "falsification",
  "hypothesis testing",
  "scientific agents",
  "simulation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "httpx>=0.27,<1",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "pydantic>=2.9,<3",
  "scipy>=1.12,<2",
]

[project.scripts]
acs = "conjecture_solver.cli:main"
conjecture-solver = "conjecture_solver.cli:main"
simjecture = "conjecture_solver.cli:main"
simjecture-mcp = "conjecture_solver.mcp_server:main"

[project.urls]
Homepage = "https://github.com/tomzhu0225/simjecture"
Documentation = "https://github.com/tomzhu0225/simjecture/tree/main/docs"
Repository = "https://github.com/tomzhu0225/simjecture"
Issues = "https://github.com/tomzhu0225/simjecture/issues"

[project.optional-dependencies]
tui = [
  "textual>=2.0,<9",
]
dsh = [
  "mcp>=2,<3",
]

[dependency-groups]
dev = [
  "hypothesis>=6.100,<7",
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<7",
  "ruff>=0.9,<1",
  "textual>=2.0,<9",
]
docs = [
  "myst-parser>=4,<5",
  "pydata-sphinx-theme>=0.20,<0.21",
  "sphinx>=8.2,<9",
  "sphinx-copybutton>=0.5,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/conjecture_solver"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "conjecture_solver/builtin_skills"
"integrations/dsh" = "conjecture_solver/dsh_bundle"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "demos/gray_scott_counterexample/record",
  "demos/collisionless_gem_reconnection/guided",
  "demos/collisionless_gem_reconnection/record",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# Simjecture is the sole scientific execution boundary in this profile. DSH
# owns the model/session loop; the Python kernel owns campaign state, evidence
# policy, commissioning, sandboxing, and durable simulation jobs.

- id: system-prompt
  config:
    persona: >-
      You are the persistent Lead Scientist for a Simjecture campaign. Begin by
      reading mcp__simjecture__snapshot and treat the operator's root hypothesis
      as immutable. You coordinate fresh, claim-scoped workers; you do not run
      experiments or mutate evidence yourself. For an open scientific claim,
      call simjecture_falsify with one bounded assignment. If it returns a
      kernel-accepted counterexample, read snapshot and call simjecture_repair on
      that falsified claim. The Repair Scientist creates one minimal contracted
      repairs child; send that child to a new Falsifier. If a Falsifier returns
      ready_for_adjudication, call simjecture_adjudicate using its exact contract
      and bounded sufficiency case. The Judge separately decides whether the
      terminal record is sufficient and assigns an explicit scientific
      disposition. Support, falsification, instrument limitation, and unresolved
      closure remain distinct; a falsified claim returns to the repair loop. For
      an insufficient record, start another fresh Falsifier with the judge's
      evidence gaps and next test. A raw blocked Falsifier handoff is resolved
      below the Lead surface by a fresh Blocker Resolver. If simjecture_falsify
      returns inconclusive with required_transition=continue_falsification, send
      its exact evidence gaps and executable next test to a fresh Falsifier. If
      it returns ready_for_adjudication with
      required_transition=independent_adjudication, send its exact terminal
      contract and sufficiency case to the Judge. Use
      simjecture_resolve_blocker only to resume a durable pre-upgrade blocker or
      retry the exact blocker-resolution assignment. Never call finalize while
      any scientific claim remains open. Preserve unknown and inconclusive
      outcomes instead of guessing. After process
      resume or semantic compaction, read snapshot before continuing and
      reconcile every durable claim and job. Reuse assignment and operation IDs
      only for an exact retry. When no open scientific frontier remains, call
      mcp__simjecture__finalize_campaign once with a bounded conclusion. Never
      self-certify scientific support, never ask for routine permission, and do
      not stop merely because one model turn ended.

# Keep DSH's event-sourced conversation beside the scientific campaign instead
# of in a global opaque session directory. The Python supervisor supplies the
# contained path and stable session identity.
- id: session-persistence-jsonl
  config:
    root: !!js "process.env.SIMJECTURE_DSH_SESSION_ROOT ?? (() => { throw new Error('SIMJECTURE_DSH_SESSION_ROOT is required') })()"

- id: compaction-basic
  config:
    auto: true
    # This route advertises a one-million-token window. Preserve a broad
    # researcher history and compact only around 500k tokens, while retaining a
    # 30k verbatim tail. Other model routes keep DSH defaults.
    modelPolicies:
      - provider: deepseek-official
        model: deepseek-v4-flash
        thresholdRatio: 0.5
        retainRatio: 0.03
        maxTokens: 4096

- id: tools
  config:
    mode: native

# The isolated profile has no generic model-facing execution surface. Routine
# scientific autonomy is governed by CampaignKernel, so DSH must not interpose
# a second interactive approval loop around its MCP client.
- id: approval
  config:
    policy: never

- id: permission
  config:
    defaultPreset: simjecture
    presets:
      simjecture:
        sandbox: workspace-write
        approval: never
        name: simjecture
        description: Scientific side effects are governed by CampaignKernel.

# Remove alternate model-facing execution and delegation surfaces. These rows
# are defense in depth; CampaignKernel remains authoritative even when invoked
# by a different MCP client.
- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

- id: tool-str-replace-editor
  disabled: true

- id: agent-instructions
  disabled: true

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: tool-subagent-report
  disabled: true

- id: workflow-worker-thread
  disabled: true

- id: tool-workflow
  disabled: true

- id: tool-ralph
  disabled: true

- id: tool-web
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-goal
  disabled: true

# The stock headless driver creates a random session on every process start.
# Simjecture replaces only that driver so pause/resume and crash recovery reuse
# one durable DSH conversation.
- id: headless-runner
  disabled: true

- insert:
    - id: simjecture-job-waiter
      name: '@simjecture/dsh-bundle/job-waiter'

    - id: simjecture-context-elider
      name: '@simjecture/dsh-bundle/context-elider'

    - id: simjecture-adjudicator
      name: '@simjecture/dsh-bundle/adjudicator'

    - id: simjecture-roles
      name: '@simjecture/dsh-bundle/roles'

    - id: simjecture-runner
      name: '@simjecture/dsh-bundle/runner'
      inject: [headlessStartup]
      config:
        task: !!js ctx.headlessStartup.task

    - id: mcp-simjecture
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: simjecture
        transport: stdio
        command: simjecture-mcp
        args: []
        cwd: !!js "process.env.SIMJECTURE_WORKSPACE ?? (() => { throw new Error('SIMJECTURE_WORKSPACE is required') })()"
        env:
          SIMJECTURE_WORKSPACE: !!js "process.env.SIMJECTURE_WORKSPACE ?? (() => { throw new Error('SIMJECTURE_WORKSPACE is required') })()"
          SIMJECTURE_CAMPAIGN: !!js "process.env.SIMJECTURE_CAMPAIGN ?? ''"
          SIMJECTURE_HYPOTHESIS_FILE: !!js "process.env.SIMJECTURE_HYPOTHESIS_FILE ?? (() => { throw new Error('SIMJECTURE_HYPOTHESIS_FILE is required') })()"
          SIMJECTURE_CAPABILITIES: !!js "process.env.SIMJECTURE_CAPABILITIES ?? ''"
          SIMJECTURE_SKILLS: !!js "process.env.SIMJECTURE_SKILLS ?? ''"
          SIMJECTURE_MCP_MAX_OUTPUT_CHARS: !!js "process.env.SIMJECTURE_MCP_MAX_OUTPUT_CHARS ?? '30000'"
          SIMJECTURE_MCP_TIMEOUT_SECONDS: !!js "process.env.SIMJECTURE_MCP_TIMEOUT_SECONDS ?? '600'"
        toolCallTimeoutMs: !!js "Math.max(1000, Number(process.env.SIMJECTURE_MCP_TIMEOUT_SECONDS ?? '600') * 1000 + 5000)"
        failOnStartupError: true
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 10000
          maxAttempts: 8
